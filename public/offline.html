<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bağlantı Yok | Eczane+</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #ededed;
      --emerald: #10b981;
      --card-bg: #141414;
      --border: #1f1f1f;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 24px;
      margin: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--emerald);
      animation: pulse 2s infinite;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 13px;
      color: #a3a3a3;
      line-height: 1.6;
      margin: 0 0 20px 0;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      background-color: var(--emerald);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 14px 20px;
      border-radius: 16px;
      transition: background-color 0.2s, transform 0.1s;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>İnternet Bağlantısı Yok</h1>
    <p>Nöbetçi+ şu anda çevrimdışı. Ancak endişelenmeyin! Son başarılı eczane aramanızı veya yerel veritabanı önbelleğini kullanarak eczanelere ulaşabilirsiniz.</p>
    <button class="btn" onclick="window.location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
